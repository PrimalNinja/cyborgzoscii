<!DOCTYPE html>
<html>
<head>
<title>ZOSCII Radio Player</title>
<script src="3p/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" type="text/css" href="css/player.css">
</head>
<body>

<h1>ZOSCII Radio Player</h1>

<div id="geZOSCIIMQPlayer" class="gsPlayer">
    <label>Queue URL: <input class="geQueueUrl" type="text" value="indexmq.php" size="50"></label><br>
    <label>Sources:<br>
    <select class="geSources" multiple size="6">
    </select></label><br>
    <label>Or custom ICY stream URL: <input class="geCustomStream" type="text" value="" size="50" placeholder="http://host:port/ or http://host:port/12"></label><br>
    <label>Behavior: 
    <select class="geBehavior">
      <option value="repeatQueue">Repeat Queue</option>
      <option value="repeatAllQueues">Repeat All Queues</option>
      <option value="nextQueue">Next Queue</option>
      <option value="waitAtEnd">Wait at End</option>
      <option value="stopAtEnd">Stop at End</option>
      <option value="randomQueue">Random Queue</option>
    </select>
    </label><br>
    <label>ROM File (optional): <input class="geROMFile" type="file"></label><br>

	<hr>
    <button class="geStartButton">Start</button>
    <button class="geStopButton">Stop</button>
    <button class="gePreviousButton">Previous</button>
    <button class="geNextButton">Next</button>

    <div class="geStatus"></div>
    <div class="geNowPlaying"></div>

	<hr>
    <audio class="gePlayer" controls crossorigin="anonymous"></audio>

	<hr>
    <div class="geImage"></div>
    <div class="geText"></div>

	<hr>
    <h3>Play Log:</h3>
    <div class="gePlayLog" style="font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;"></div>
</div>

<script src="js/zosciiradioplayer.js"></script>
<script>
$(document).ready(function() 
{
	var arrSources = [
		{
			name: 'Cyborg Unicorn',
			type: 'mq',
			url: 'indexmq.php',
			queue: 'Cyborg Unicorn'
		},
		{
			name: 'ZOSCII',
			type: 'mq',
			url: 'indexmq.php',
			queue: 'ZOSCII'
		},
		{
			name: 'Radio One (stream)',
			type: 'icy',
			url: 'http://localhost:8000/',
			session: 0
		},
		{
			name: 'Radio Two (shared)',
			type: 'icy',
			url: 'http://localhost:8001/',
			session: 0
		}
	];

	function element(strScope_a, strClass_a)
	{
		return $('.' + strClass_a, '#' + strScope_a);
	}

	// Populate source listbox - value is the index into arrSources
	var objSources = element('geZOSCIIMQPlayer', 'geSources');
	for (var intI = 0; intI < arrSources.length; intI++)
	{
		var objSrc = arrSources[intI];
		objSources.append(
			'<option selected="selected" value="' + intI + '">' +
			objSrc.name + ' [' + objSrc.type + ']' +
			'</option>'
		);
	}

	// Auto-load the logo as the ROM, same trick as the full player
	var objLogo = element('geZOSCIIMQPlayer', 'geLogo');
	var objROMFile = element('geZOSCIIMQPlayer', 'geROMFile')[0];

	var objRadioPlayer = new ZOSCIIRadioPlayer('geZOSCIIMQPlayer', { 
		imageDelay: 10,
		onStart: function()
		{
			// Resolve selected indices into source objects
			var arrIdx = element('geZOSCIIMQPlayer', 'geSources').val() || [];
			var arrPicked = [];

			for (var intI = 0; intI < arrIdx.length; intI++)
			{
				arrPicked.push(arrSources[parseInt(arrIdx[intI], 10)]);
			}

			// Custom ICY URL becomes a one-off source appended to the picked list
			var strCustom = element('geZOSCIIMQPlayer', 'geCustomStream').val();
			if (strCustom && strCustom.trim().length > 0)
			{
				arrPicked.push({
					name: 'Custom',
					type: 'icy',
					url: strCustom.trim(),
					session: 0
				});
			}

			return arrPicked;
		}
	});
});
</script>

</body>
</html>
